name: build

on:
  workflow_call:
    inputs:
      upload-artifacts:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
            cc: gcc
            cgo: "1"
            binary: uuid-clipboard
          - runner: ubuntu-latest
            goos: linux
            goarch: arm
            cc: arm-linux-gnueabihf-gcc
            cgo: "1"
            binary: uuid-clipboard-arm32
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            cc: gcc
            cgo: "1"
            binary: uuid-clipboard-arm64
          - runner: windows-latest
            goos: windows
            goarch: amd64
            cc: gcc
            cgo: "0"
            binary: uuid-clipboard.exe
          - runner: macos-latest
            goos: darwin
            goarch: arm64
            cc: clang
            cgo: "1"
            binary: uuid-clipboard-apple-silicon
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ">=1.26.0"

      - name: Install X11 headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev

      - name: Install ARM32 compiler
        if: matrix.goarch == 'arm'
        run: sudo apt-get install -y gcc-arm-linux-gnueabihf

      - name: Test
        run: go test -v ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: "7"
          CGO_ENABLED: ${{ matrix.cgo }}
          CC: ${{ matrix.cc }}
        run: go build -o dist/${{ matrix.binary }} .

      - name: Upload binary
        if: inputs.upload-artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/${{ matrix.binary }}
          if-no-files-found: error
